area:
  title: The area
  text: "Nalani is in a beautiful, peaceful area on a quiet street in An Bang, Hội An. It's a 4-minute walk to the beach and a 10-minute walk to one of Hội An's main attractions: the rice fields and the vegetable village with their scenic bicycle paths. The old town is a 20-minute bike ride away — or half the time if you rent a scooter from us."
