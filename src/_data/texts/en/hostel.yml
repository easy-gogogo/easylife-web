todo:
  title: What to do in Hội An
  text: "Hội An is a charming ancient town in central Vietnam, known for its well-preserved architecture, lantern-lit streets and unique cultural heritage. Stroll through the old town, visit the local markets and try the food. For history lovers there's the Japanese Covered Bridge and the Quan Công Temple — and the beaches are right on your doorstep."
