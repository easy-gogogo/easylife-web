transfers:
  title: Shuttles & transfers
  ask: Book now
  more: More info
  items:
  - id: shuttle-danang
    title: Shuttle bus to Da Nang
    price: 170K VND
    meta:
    - Hotel Pickup
    - Daily departures
    short: |-
      <p><strong>Pickup directly from your hostel/hotel!</strong></p>
      <p><strong>Departure times from Hội An:</strong><br/>
      6:00 · 7:00 · 9:00 · 10:00 · 12:00 · 13:00 · 15:00 · 16:00 · 18:00 · 20:00</p>
    images:
    - /images/transport/airport-shuttle-hoi-an.jpg
    full: |-
      <div class="stop-group">
      <div class="stop-title">✈️ Da Nang Airport Stops:</div>
      <ul class="stop-list">
      <li><strong>Pick up:</strong> Arrival Gate A4 – Domestic Terminal</li>
      <li><strong>Drop off:</strong> Departure Hall of Domestic Terminal</li>
      </ul>
      </div>
      <div class="stop-group">
      <div class="stop-title">🏙️ Da Nang City Center Stops:</div>
      <ul class="stop-list">
      <li>Da Nang Train Station (Train cafe at Main entrance)</li>
      <li>Cham Museum Da Nang</li>
      <li>Hiyori Garden Tower – 02 Vo Van Kiet St.</li>
      <li>A La Carte Beach Hotel – 200 Vo Nguyen Giap St.</li>
      <li>Holiday Beach Hotel – 300 Vo Nguyen Giap St.</li>
      </ul>
      </div>
      <div class="stop-group">
      <div class="stop-title">🏡 Hoi An City Center Stops:</div>
      <ul class="stop-list">
      <li>Barri Ann Travel office – 30/2 Tran Hung Dao St.</li>
      <li>Agribank ATM – 255 Cua Dai St.</li>
      <li>Silk Village The Tourist – 28 Nguyen Tat Thanh St.</li>
      <li>Hoi An iVy Hotel – 01 Dao Duy Tu St.</li>
      </ul>
      </div>
      <div class="stop-group">
      <div class="stop-title">🏖️ Hoi An Beach Area Stops:</div>
      <ul class="stop-list">
      <li>Dahan Spa – 130 Lac Long Quan St.</li>
      <li>Hoi An Beach Resort – 01 Cua Dai St.</li>
      </ul>
      </div>
  - id: private-car
    title: Private car to Da Nang
    price: 320K VND
    meta:
    - Door-to-Door
    - 24/7 Available
    short: |-
      <p>Direct, comfortable ride in a private car from door to door.</p>
      <p><strong>Price:</strong> 320,000 VND</p>
      <p><small>(+50K surcharge for night rides between 10:00 PM and 5:00 AM)</small></p>
    images:
    - /images/transport/private-car-hoi-an.jpg
    full: |-
      <p>Perfect for families, groups with lots of luggage, or if you want to reach your destination flexibly and without stops (airport, train station, or hotel in Da Nang).</p>
  - id: hue-motorbike
    title: One-way scooter to Huế
    price: 700K VND
    meta:
    - Self-Drive
    - Luggage Transport
    short: |-
      <p>For only <strong>700K VND</strong> you can drive by yourself to Hue!</p>
      <p>You will get a Motorbike at our Hostel. Your luggage will be transported to your new Hostel in Hue (+50K extra if you are 2 people on 1 Motorbike).</p>
    images:
    - /images/rentals/motorbikes/scooter-rental-hai-van-pass.jpg
    full: |-
      <ul>
      <li>You will use the famous <strong>Hai Van Pass</strong> and see waterfalls &amp; beautiful beaches.</li>
      <li>The road is easy to ride and all bikes are automatic.</li>
      <li><strong>Custom Map included:</strong> One of our guests made a detailed map with all top spots along the way!</li>
      </ul>
  - id: easy-rider
    title: Easy Rider tour to Huế
    price: 1.3M VND
    meta:
    - Incl. Entrance Fees
    - Experienced Local Driver
    short: |-
      <p><strong>For only 1,300,000 VND (incl. entrance fees)</strong></p>
      <p>Sit back, relax and enjoy the ride! Our experienced drivers know all the best local spots and tell you amazing stories along the way.</p>
    images:
    - /images/transport/easy-rider-hoi-an-1.jpg
    - /images/transport/easy-rider-hoi-an-2.jpg
    full: |-
      <ul>
      <li>Stop at Marble Mountain or Lady Buddha</li>
      <li>Scenic drive across the Hai Van Pass</li>
      <li>Stop at Lap An Lagoon</li>
      <li>Stop at Lang Co Beach for delicious lunch</li>
      <li>Refreshing stop at the Waterfall</li>
      </ul>
guide:
  title: VIP or limousine bus?
  intro: All our long-distance buses have curtains for privacy and USB chargers for your devices.
  items:
  - title: VIP sleeper bus
    image: /images/transport/vip-bus-inside-view.jpg
    text: Wider individual cabins for extra comfort and privacy, in a bus of the same length. Highly recommended for longer rides!
  - title: Limousine sleeper bus (standard)
    image: /images/transport/limousine-bus-inside-view.jpg
    text: Modern sleeper berths in standard width. Cozy, budget-friendly and fully equipped with curtains and USB chargers.
  wa: the sleeper buses
  ask: Ask us on WhatsApp
