todo:
  title: Làm gì ở Hội An
  text: "Hội An là một đô thị cổ duyên dáng ở miền Trung Việt Nam, nổi tiếng với kiến trúc được bảo tồn tốt, những con phố rực rỡ đèn lồng và di sản văn hóa độc đáo. Dạo quanh phố cổ, ghé chợ và thưởng thức ẩm thực. Với người yêu lịch sử có Chùa Cầu và Quan Công Miếu — còn biển thì ngay trước cửa."
