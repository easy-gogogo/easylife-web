  title: Khu vực xung quanh
  text: "Nalani nằm trong một khu vực đẹp và yên bình, trên con đường nhỏ yên tĩnh ở An Bàng, Hội An. Đi bộ 4 phút là ra biển, 10 phút là tới một trong những điểm hấp dẫn nhất Hội An: cánh đồng lúa và làng rau với những con đường đạp xe tuyệt đẹp. Phố cổ cách 20 phút đạp xe — hoặc chỉ một nửa thời gian nếu bạn thuê xe máy của chúng tôi."
