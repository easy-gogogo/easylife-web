  title: "Nalani Hostel & Homestay Hội An – Hồ bơi, sân thượng & 4 phút ra biển An Bàng"
  description: "Hostel vui vẻ mà thư thái ở Cẩm An, Hội An: phòng dorm và phòng riêng, hồ bơi, sân thượng, nước uống và khăn tắm miễn phí — 4 phút đi bộ ra biển. Rẻ hơn 10% so với các trang đặt phòng."
