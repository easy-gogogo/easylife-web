categories:
- id: top-highlights
  title: Nổi bật & bán chạy nhất
  items:
  - id: tailor
    title: Tiệm may Bảo Điệp
    price: liên hệ
    meta:
    - May đo theo yêu cầu
    short: May đo tại Bao Diep Tailor — quần áo thủ công chất lượng cao, vừa vặn với dáng của bạn. Xem các mẫu gần đây trên Instagram và hỏi chúng tôi để đặt lịch.
  - id: sup
    title: EasyLife SUP – chèo ngắm hoàng hôn
    price: từ 200K VND / giờ
    meta:
    - hoàng hôn trên sông
    - cho mọi lứa tuổi
    short: Chắc chắn là trải nghiệm hoàng hôn đẹp nhất thành phố! Ngắm mặt trời lặn trên sông và xem ngư dân chuẩn bị lưới.
  - id: cooking-class
    title: Lớp nấu ăn sinh thái Bảy Mẫu
    price: từ 520K VND/người
    meta:
    - Bắt đầu 9:30 / 14:30
    - tối đa 12 người
    short: Khám phá ẩm thực Việt đích thực tại một trường dạy nấu ăn nhà sàn bên sông. Từ năm 2002, các đầu bếp ở đây đã hướng dẫn khách nấu 4 món kinh điển và khám phá rừng dừa Bảy Mẫu.
    full: |-
      <p><strong>Nấu ăn kèm thuyền thúng:</strong> 670.000 VND/người · Buổi sáng 8:20–13:00 · Buổi chiều 13:35–18:00.</p>
      <p><strong>Chỉ nấu ăn, không đi thuyền thúng:</strong> 520.000 VND/người — bắt đầu lúc 9:30 hoặc 14:30.</p>
      <p><strong>Lớp nấu 4 món gồm:</strong></p>
      <ul>
      <li>Bánh xèo (nhân thịt heo &amp; tôm)</li>
      <li>Phở bò (nước dùng thơm gia vị)</li>
      <li>Gỏi cuốn (tôm &amp; thịt heo)</li>
      <li>Bún bò Nam Bộ</li>
      <li>Kèm nước chanh dây tự làm, nước mắm chua ngọt, tương đen &amp; trái cây theo mùa</li>
      </ul>
      <p><strong>Tự tay trải nghiệm:</strong> giã và sàng gạo bằng cối đá, xay gạo bằng chày gỗ, tráng bánh tráng thủ công.</p>
      <p><strong>Lựa chọn có thuyền thúng (Bay Mau Eco Cooking Class):</strong> buổi sáng 8:20–13:00 / buổi chiều 13:35–18:00, 670K/người, có giảm giá cho trẻ em. Gồm đi chợ, đi thuyền thúng tre truyền thống qua rừng dừa Bảy Mẫu với câu cua và biểu diễn thuyền thúng, lớp nấu 4 món, cùng ăn trưa/tối và đưa đón tại khách sạn.</p>
      <p><strong>Chính sách trẻ em:</strong> dưới 3 tuổi miễn phí · 3–9 tuổi 50% giá người lớn · từ 10 tuổi giá người lớn.</p>
      <p>Bếp riêng, đáp ứng chế độ ăn đặc biệt (chay, không gluten…), đưa đón tại khách sạn trong khu phố cổ Hội An, sổ công thức &amp; quà tặng khi kết thúc.</p>
  - id: cham-island-snorkeling
    title: Lặn ngắm san hô + lặn bình khí ở Cù Lao Chàm
    price: từ 1,5 triệu VND/người
    meta:
    - cả ngày, đón lúc 7:00
    - Cù Lao Chàm
    short: Khám phá vẻ đẹp Cù Lao Chàm trên mặt nước lẫn dưới đáy biển. Tour trọn ngày có hướng dẫn với lặn ngắm san hô hoặc lặn bình khí, thời gian tắm biển và bữa trưa địa phương ngon miệng.
    full: |-
      <p><strong>Lặn bình khí (mỗi người):</strong></p>
      <ul>
      <li>Đã có chứng chỉ: 2.400.000 VND — 2 lần lặn có hướng dẫn, đầy đủ thiết bị, ca nô &amp; đưa đón khách sạn</li>
      <li>Chưa có chứng chỉ: 2.100.000 VND — 1 lần lặn cho người mới + lặn ngắm san hô, đầy đủ thiết bị &amp; hướng dẫn</li>
      <li>Chỉ lặn ngắm san hô: 1.500.000 VND — rạn san hô rực rỡ, thiết bị tốt, không cần kinh nghiệm lặn</li>
      </ul>
      <p><strong>Ngoài ra:</strong> khóa học lặn PADI (mọi cấp độ), tour riêng bằng ca nô, trải nghiệm Cù Lao Chàm 2 ngày 1 đêm.</p>
      <p>✅ Xe đón tại khách sạn &amp; ca nô · ✅ Thiết bị lặn bình khí hoặc lặn ngắm san hô + hướng dẫn viên chuyên nghiệp · ✅ Cà phê, trà &amp; đồ ăn nhẹ trên tàu · ✅ Bữa trưa Việt truyền thống trên bãi biển (thịt, hải sản hoặc chay) · ✅ Thời gian tự do trên võng + tắm biển</p>
      <p><strong>Lịch trình:</strong> 7:00–7:40 đón tại khách sạn · 8:00 tàu khởi hành ra Cù Lao Chàm · 9:30–10:30 lặn lần 1 · 10:30–10:50 nghỉ và ăn nhẹ · 11:00–12:00 lặn lần 2 · 12:30 đến Bãi Chồng · 13:00 ăn trưa &amp; tắm biển · 14:15–14:45 quay về · 16:00–16:30 về đến khách sạn.</p>
  - id: coffee-class
    title: Lớp cà phê — 5 loại cà phê
    price: 350.000 VND
    meta:
    - 2 giờ · 10/11 giờ sáng, 2/3 giờ chiều
    short: Học tự pha 5 loại cà phê truyền thống Việt Nam.
    full: |-
      <ul>
      <li>Cà phê đen truyền thống pha phin</li>
      <li>Cà phê sữa Việt Nam</li>
      <li>Cà phê muối cung đình Huế</li>
      <li>Cà phê dừa Hội An</li>
      <li>Cà phê trứng Hà Nội</li>
      </ul>
      <p>Thời lượng: 2 giờ · Giá: 350.000 VND</p>
  - id: lantern-making
    title: Workshop làm đèn lồng
    price: 250K–350K VND
    meta:
    - 2–3 giờ, giờ linh hoạt
    - từ 3 tuổi
    short: Bước vào thế giới đầy màu sắc của nghề thủ công Việt và tự làm chiếc đèn lồng lụa gấp được — món quà lưu niệm độc nhất và kỷ niệm khó quên về Hội An!
    full: |-
      <p><strong>Lớp đầy đủ – 3 giờ:</strong> tự làm cả 11 bước — buộc nan tre bằng chỉ, uốn khung thành hình "mặt trời mọc", gắn vào vòng kim loại, chọn vải, cắt vải, căng vải lên khung, bọc các mặt bên, trang trí trên và dưới, gắn tua, hoàn thiện.</p>
      <p><strong>Lớp nhanh – 2 giờ:</strong> bắt đầu từ bước 5 — khung đã làm sẵn, bạn chọn và dán vải.</p>
      <p><strong>Giờ bắt đầu:</strong> linh hoạt, bất cứ lúc nào trong ngày. <strong>Giá:</strong> lớp nhanh 250.000 VND · lớp đầy đủ 350.000 VND.</p>
      <p>Bao gồm: chiếc đèn lồng lụa gấp được do bạn tự làm · trà Việt chào đón · quà lưu niệm nhỏ · hướng dẫn viên nói tiếng Anh · nghệ nhân địa phương hỗ trợ tận tay.</p>
      <p>Vui cho mọi lứa tuổi — khách đi một mình, nhóm bạn hay trẻ em từ 3 tuổi!</p>
  - id: langur-monkeys
    title: Ngắm voọc buổi sáng
    price: 55 USD/người
    meta:
    - 3 giờ · bắt đầu 6:30
    - nhóm nhỏ
    - Thiên nhiên hoang dã
    short: Khám phá Khu bảo tồn thiên nhiên Sơn Trà vào sáng sớm để quan sát loài voọc chà vá chân nâu quý hiếm trong môi trường tự nhiên, cùng kiểm lâm và nhiếp ảnh gia động vật hoang dã giàu kinh nghiệm.
    full: |-
      <p>Chúng tôi bắt đầu trong khoảng 6:30 – 6:45 (tùy mùa) với việc đón tại khách sạn. Sáng sớm là lúc voọc chà vá chân nâu hoạt động nhiều nhất. Đi bộ trên những lối mòn xanh mát, tận hưởng không khí núi trong lành và học cách phát hiện động vật ẩn trong tán lá.</p>
      <p><strong>Trải nghiệm:</strong></p>
      <ul>
      <li>Khám phá Khu bảo tồn Sơn Trà với những đoạn đi bộ ngắn, dễ.</li>
      <li>Di chuyển bằng xe máy, ngồi sau tài xế chuyên nghiệp (có thể đi ô tô theo yêu cầu, phụ thu thêm).</li>
      <li>Kiểm lâm/hướng dẫn viên giàu kinh nghiệm, quan sát động vật có trách nhiệm.</li>
      </ul>
      <p><strong>Bao gồm:</strong> đón &amp; trả tại khách sạn khu vực Đà Nẵng · nước uống &amp; trái cây tươi · ống nhòm hoặc kính quan sát.</p>
- id: workshops
  title: Thủ công & workshop sáng tạo
  items:
  - id: woodart
    title: Workshop Woodart
    price: 600.000 VND
    meta:
    - 3 giờ · 9:00 / 14:00
    - hơn 1 triệu người theo dõi YouTube
    short: Hơn 1 triệu người đăng ký YouTube đã nói lên tất cả! Làm việc trực tiếp với các nghệ nhân chạm khắc hàng đầu đứng sau "Woodart Vietnam" và học chạm gỗ trong lớp 3 giờ hoặc khóa chuyên sâu đến 28 ngày.
    full: |-
      <p><strong>Lịch học &amp; thời lượng:</strong> hai buổi mỗi ngày, mỗi buổi 3 giờ (sáng 9:00 | chiều 14:00).</p>
      <p><strong>Trải nghiệm &amp; điểm nổi bật:</strong></p>
      <ul>
      <li>Tự tạo tác phẩm gỗ độc đáo của riêng bạn dưới sự hướng dẫn tận tình của nghệ nhân lành nghề.</li>
      <li>Chọn mẫu có sẵn hoặc tự thiết kế — từ họa tiết truyền thống, hoa lá đến nhân vật anime hay sinh vật huyền thoại.</li>
      <li>Tham quan xưởng chạm khắc với hàng trăm tác phẩm tinh xảo.</li>
      <li>Chiêm ngưỡng bộ sưu tập gỗ nghệ thuật của Âu Lạc Artisan, nổi tiếng qua kênh YouTube “Woodart Vietnam” với hơn 1 triệu người đăng ký.</li>
      </ul>
      <p><strong>Giá:</strong> 600.000 VND/người.</p>
      <p><em>Số chỗ có hạn — hãy giữ chỗ ngay hôm nay! Hỏi chúng tôi về các khóa chuyên sâu dài hơn (đến 28 ngày).</em></p>
  - id: woodcarving
    title: Workshop khắc gỗ — Làng gỗ lũa
    price: 400K–500K VND
    meta:
    - 2–2,5 giờ · 8:30 / 14:00
    - tối đa 25 người
    short: Tạm rời phố xá đông đúc để đắm mình trong nghề thủ công Việt đích thực! Tham gia workshop ngoài trời thoải mái và học từ nghệ nhân địa phương cách biến gỗ lũa tự nhiên thành món quà lưu niệm khắc tay của riêng bạn.
    full: |-
      <p>Hai buổi mỗi ngày, mỗi buổi 2 đến 2,5 giờ: buổi sáng 8:30, buổi chiều 14:00. Tối đa 25 người mỗi lớp.</p>
      <p><strong>Giá:</strong> người lớn 500.000 VND · trẻ em 400.000 VND.</p>
      <p>Bao gồm: toàn bộ gỗ chất lượng, đầy đủ dụng cụ, nghệ nhân hướng dẫn từng bước, đồ uống chào đón mát lạnh và tác phẩm hoàn thiện để mang về.</p>
      <p>Phù hợp cho người mới, gia đình và những ai yêu sáng tạo.</p>
  - id: leather
    title: Workshop đồ da
    price: từ 26 USD/người
    meta:
    - 2 giờ – 2 ngày, tùy lớp
    short: Bốn cấp độ lớp học được yêu thích — từ ví đựng thẻ đơn giản trong hai giờ đến chiếc ba lô của riêng bạn trong hai ngày.
    full: |-
      <ul>
      <li><strong>Lớp nhanh (2 giờ):</strong> làm ví đựng thẻ đơn giản hoặc móc khóa (tự thiết kế hoặc theo mẫu) — 26 USD/người</li>
      <li><strong>Lớp cơ bản (4 giờ):</strong> làm bao hộ chiếu, ví đơn giản, ví cầm tay, ví dài hoặc túi đơn giản (theo mẫu) — 45 USD/người</li>
      <li><strong>Lớp trung cấp (1 ngày):</strong> túi đơn giản với thiết kế phức tạp hơn, hoặc bộ ví + móc khóa + ví đựng thẻ — 96 USD/người</li>
      <li><strong>Lớp nâng cao (2 ngày):</strong> ba lô đơn giản hoặc túi xách — 196 USD/người</li>
      </ul>
      <p>Trong lớp hai giờ bạn có thể tự thiết kế hoặc xem các mẫu ví — hỏi chúng tôi để xem ví dụ.</p>
  - id: bamboo
    title: Workshop tre
    price: 790K VND
    meta:
    - 3 giờ · 9–12 giờ / 14–17 giờ
    - Rừng dừa Bảy Mẫu
    short: Một xưởng lớn bên sông đầy tác phẩm nghệ thuật. Thật thú vị khi xem anh Tấn làm được những gì từ tre — cá dài 2 mét, cú lớn, cả xe đạp!
    full: |-
      <p>Nơi này đáng ghé thăm ngay cả khi không học lớp tre. Xưởng nằm ở khu rừng dừa, gần chỗ thuyền thúng. Trong lớp học, bạn có thể chọn làm nhiều món khác nhau — ở nhà chúng tôi cũng có vài chiếc đèn tre, cứ hỏi nhé.</p>
      <p>Thời lượng: 3 giờ · sáng 9:00–12:00, chiều 14:00–17:00 · Giá: 790.000 VND</p>
  - id: jewelry
    title: Workshop làm trang sức
    price: 1,1–1,5 triệu VND
    meta:
    - 10–12 giờ / 14–16 giờ
    short: Thỏa sức sáng tạo ở Hội An với workshop làm trang sức. Dưới sự hướng dẫn của nghệ nhân lành nghề, bạn biến bạc thô thành một món độc nhất — nhẫn, mặt dây chuyền hay vòng tay — mang phong cách riêng của bạn.
    full: |-
      <p>Từ tạo hình, hàn đến đánh bóng, mỗi bước đưa bạn đắm mình vào nghề kim hoàn bạc truyền thống Việt Nam. Không cần kinh nghiệm — chỉ cần trí tưởng tượng, và bạn sẽ mang về một món trang sức thủ công cùng những kỷ niệm khó quên.</p>
      <p>Giá: 1.100.000 – 1.500.000 VND · Thời gian: sáng 10:00–12:00 hoặc chiều 14:00–16:00.</p>
- id: tours
  title: Tour trong ngày & phiêu lưu ngoài trời
  items:
  - id: sea-trek
    title: Đi bộ dưới đáy biển — Sea Trek®
    price: từ 890K VND/người
    meta:
    - đón 7:30–8:15
    - Hội An / Đà Nẵng → Cù Lao Chàm
    short: Tour đưa bạn từ Hội An hoặc Đà Nẵng ra Cù Lao Chàm — khu dự trữ sinh quyển được UNESCO công nhận — bằng ca nô. Tắm biển, lặn ngắm san hô và trải nghiệm "đi bộ dưới đáy biển" có hướng dẫn giữa đàn cá và san hô rực rỡ.
    full: |-
      <p>✅ Hướng dẫn viên (tiếng Anh) · ✅ Đưa đón · ✅ Ca nô · ✅ Đi bộ dưới biển và đầy đủ đồ lặn ngắm san hô · ✅ Bữa trưa · ✅ Vé tham quan · ✅ Bảo hiểm du lịch</p>
      <p><strong>Lịch trình:</strong> 7:30–8:15 đón tại chỗ ở, di chuyển ra bến Cửa Đại, Hội An · 9:00 đi ca nô 20 phút ra Cù Lao Chàm · 9:20 đến bãi Hòn Nhồn, tự do đi bộ dưới biển và lặn ngắm san hô · 11:00 ăn trưa hải sản tại khu sinh thái Bãi Chồng, tắm biển hoặc nghỉ ngơi · 14:00 về lại bến Cửa Đại.</p>
      <p><strong>Giá:</strong> người lớn 1.600.000 VND · trẻ 8–12 tuổi 1.250.000 VND · trẻ 4–7 tuổi (chỉ lặn ngắm san hô) 890.000 VND · dưới 4 tuổi miễn phí.</p>
  - id: atv-tour
    title: Tour xe ATV — nửa ngày
    price: từ 1,65 triệu VND/người
    meta:
    - 5 giờ · bắt đầu 8:30 / 13:30
    short: Lái xe ATV qua những ngôi làng và cánh rừng đẹp như tranh, kèm bữa trưa BBQ và nhiều điểm dừng chụp ảnh đáng nhớ.
    full: |-
