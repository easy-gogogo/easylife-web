# EasyLife Villa (Vietnamesisch)
meta:
  title: "EasyLife Villa Hội An – Khách sạn nhỏ có hồ bơi & ban công gần biển"
  description: "Khách sạn nhỏ ở Cẩm An, Hội An: phòng nào cũng có ban công, hồ bơi, phòng giải trí, bao gồm bữa sáng và xe đạp miễn phí. 2 phút ra sông, vài bước tới biển. Giảm 10% khi đặt trực tiếp."
