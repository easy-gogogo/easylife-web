  text: "날라니는 호이안 안방의 조용한 골목, 아름답고 평화로운 동네에 있어요. 해변까지 도보 4분, 호이안의 대표 명소인 논과 채소 마을까지는 도보 10분이에요. 멋진 자전거 길도 있어요. 올드타운까지는 자전거로 20분 — 저희 스쿠터를 빌리면 그 절반이면 충분해요."
