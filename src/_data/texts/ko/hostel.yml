todo:
  title: 호이안에서 할 일
  text: "호이안은 베트남 중부의 매력적인 옛 도시로, 잘 보존된 건축물과 등불이 빛나는 거리, 독특한 문화유산으로 유명해요. 올드타운을 거닐고 시장을 구경하며 음식을 맛보세요. 역사를 좋아한다면 내원교(일본교)와 관공묘가 있고, 해변은 바로 문 앞에 있어요."
