about:
  eyebrow: 저희를 소개합니다
  title: Lan & Martin
  text: "저희는 베트남–독일 커플로 10년 넘게 게스트를 맞이하고 있어요. 게스트들은 오래, 때로는 몇 달씩 머물러요. 액티비티를 좋아하는 분도, 그냥 수다 떨며 쉬고 싶은 분도 있죠 — 저희는 둘 다 좋아요."
  values:
    - { title: 높은 기준, text: "혼자, 커플, 가족 모두를 위한 깨끗하고 아늑한 객실." }
    - { title: 어울림 & 편안함, text: "파티하고 싶다면 즐기세요. 쉬고 싶다면 저희가 챙길게요." }
    - { title: 탐험, text: "해변, 강, 올드타운이 가깝고 다낭 공항에서 45분." }
  cta: 저희 이야기 더 보기
  alt: "야자수 길에서 웃고 있는 이지라이프의 주인 Lan과 Martin"
