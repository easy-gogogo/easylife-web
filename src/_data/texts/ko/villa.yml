  chips: [수영장, 조식 포함, 무료 자전거, 세탁 서비스]
  eyebrow: "이지라이프 빌라 · 호이안 껌안"
  title: "집처럼 편안한 곳"
  lead: "강가에 자리해 조용하고 한적한 해변까지 걸어서 금방, 평화로운 골목에 숨어 있어요. 혼자, 커플, 가족을 위한 모던한 소규모 호텔 — 수영장, 게임룸, 그리고 모든 객실에 발코니가 있어요."
  alt: "발코니와 야자수가 있는 이지라이프 빌라 건물"
