# EasyLife Villa (Koreanisch)
meta:
  title: "이지라이프 빌라 호이안 – 해변 근처 수영장 & 발코니 있는 소규모 호텔"
  description: "호이안 껌안의 소규모 호텔: 전 객실 발코니, 수영장, 게임룸, 조식 포함, 자전거 무료. 강까지 2분, 해변까지 도보로 금방. 직접 예약 시 10% 할인."
