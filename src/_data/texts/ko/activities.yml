  - id: lantern-making
    title: 등불 만들기 워크숍
    price: 250K–350K VND
    meta:
    - 2–3시간, 시간 자유
    - 3세 이상
    short: 알록달록한 베트남 공예의 세계에 빠져 접이식 실크 등불을 직접 만들어 보세요 — 세상에 하나뿐인 기념품이자 호이안의 잊지 못할 추억이 될 거예요!
    full: |-
      <p><strong>풀 클래스 – 3시간:</strong> 11단계를 모두 직접 — 대나무 살을 실로 묶기, 틀을 "해돋이" 모양으로 구부리기, 금속 링에 고정하기, 원단 고르기, 원단 자르기, 틀에 원단 씌우기, 옆면 감싸기, 위아래 장식하기, 술 달기, 마무리.</p>
      <p><strong>익스프레스 클래스 – 2시간:</strong> 5단계부터 시작 — 틀은 미리 준비되어 있고, 원단을 골라 붙이면 돼요.</p>
      <p><strong>시작 시간:</strong> 낮 시간 중 언제든 자유롭게. <strong>가격:</strong> 익스프레스 250,000 VND · 풀 클래스 350,000 VND.</p>
      <p>포함: 직접 만든 접이식 실크 등불 · 웰컴 베트남 차 · 작은 기념품 · 영어 가이드 · 현지 장인의 1:1 도움.</p>
      <p>혼자 여행하는 분, 친구, 3세 아이까지 누구나 즐길 수 있어요!</p>
  - id: langur-monkeys
    title: 아침 원숭이(더크랑구르) 관찰
    price: 1인 55달러
    meta:
    - 3시간 · 오전 6:30 시작
    - 소규모 그룹
    - 야생동물
    short: 이른 아침 선짜 자연보호구역을 탐험하며 멸종위기종 붉은다리더크랑구르를 자연 서식지에서 관찰해요. 경험 많은 산림 레인저, 야생동물 사진작가와 함께합니다.
    full: |-
      <p>계절에 따라 오전 6:30–6:45 사이 호텔 픽업으로 시작해요. 이른 아침이 붉은다리더크랑구르가 가장 활발한 시간이에요. 울창한 정글 길을 걷고 상쾌한 산 공기를 마시며 나무 위에 숨은 동물을 찾는 법을 배워요.</p>
      <p><strong>체험 내용:</strong></p>
      <ul>
      <li>짧고 쉬운 산책으로 선짜 자연보호구역 탐험.</li>
      <li>전문 기사가 운전하는 오토바이 뒷좌석으로 이동 (자동차는 요청 시 추가 요금).</li>
      <li>윤리적인 야생동물 관찰을 실천하는 경험 많은 레인저/강사 동행.</li>
      </ul>
      <p><strong>포함:</strong> 다낭 지역 호텔 픽업 &amp; 드롭 · 식수 &amp; 신선한 과일 · 관찰용 쌍안경 또는 필드스코프.</p>
