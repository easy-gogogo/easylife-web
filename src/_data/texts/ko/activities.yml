  - id: cooking-class
    title: 바이마우 에코 쿠킹 클래스
    price: 1인 520K VND부터
    meta:
    - 오전 9:30 / 오후 2:30 시작
    - 최대 12명
    short: 강가에 수상 가옥으로 지어진 요리 학교에서 진짜 베트남 요리를 배워 보세요. 2002년부터 셰프들이 클래식 요리 4가지를 가르치고, 바이마우 코코넛 숲도 함께 둘러봐요.
    full: |-
      <p><strong>바구니 배 + 쿠킹 클래스:</strong> 1인 670,000 VND · 오전 투어 8:20–13:00 · 오후 투어 13:35–18:00.</p>
      <p><strong>쿠킹 클래스만 (바구니 배 없음):</strong> 1인 520,000 VND — 오전 9:30 또는 오후 2:30 시작.</p>
      <p><strong>4코스 쿠킹 클래스 메뉴:</strong></p>
      <ul>
      <li>반쎄오 (돼지고기 &amp; 새우를 넣은 바삭한 쌀 부침)</li>
      <li>퍼보 (향신료 향이 가득한 소고기 쌀국수)</li>
      <li>고이꾸온 (새우 &amp; 돼지고기 월남쌈)</li>
      <li>분보남보 (소고기 비빔 쌀국수)</li>
      <li>그리고 수제 패션프루트 주스, 새콤달콤한 느억맘 소스, 해선장 &amp; 제철 과일</li>
      </ul>
      <p><strong>직접 해 보는 체험:</strong> 돌절구에 쌀 찧고 고르기, 나무 절굿공이로 쌀 갈기, 라이스페이퍼 손으로 만들기.</p>
      <p><strong>바구니 배 옵션 (Bay Mau Eco Cooking Class):</strong> 오전 8:20–13:00 / 오후 13:35–18:00, 1인 670K, 어린이 할인 가능. 시장 방문, 전통 대나무 바구니 배를 타고 바이마우 코코넛 숲 둘러보기(게 잡기, 바구니 배 공연 포함), 4코스 쿠킹 클래스, 함께하는 식사, 호텔 픽업 &amp; 드롭 포함.</p>
      <p><strong>어린이 요금:</strong> 3세 미만 무료 · 3–9세 성인 요금의 50% · 10세 이상 성인 요금.</p>
      <p>전용 주방, 특별 식단 가능 (채식, 글루텐프리 등), 호이안 올드타운 호텔 픽업 &amp; 드롭, 레시피 북 &amp; 기념 선물 증정.</p>
  - id: cham-island-snorkeling
    title: 참섬 스노클링 + 다이빙
    price: 1인 1.5M VND부터
    meta:
    - 종일, 오전 7:00 픽업
    - 참섬
    short: 바다 위와 아래에서 참섬의 아름다움을 만나 보세요. 스노클링 또는 스쿠버 다이빙, 해변에서의 휴식, 맛있는 현지식 점심이 포함된 가이드 동행 종일 투어예요.
    full: |-
      <p><strong>스쿠버 다이빙 (1인):</strong></p>
      <ul>
      <li>자격증 소지자: 2,400,000 VND — 가이드 동행 다이빙 2회, 전 장비, 스피드보트 &amp; 호텔 이동</li>
      <li>자격증 미소지자: 2,100,000 VND — 초보자 다이빙 1회 + 추가 스노클링, 전 장비 &amp; 교육</li>
      <li>스노클링만: 1,500,000 VND — 화려한 산호초, 좋은 장비, 다이빙 경험 불필요</li>
      </ul>
      <p><strong>그 밖에:</strong> PADI 다이빙 코스(모든 레벨), 스피드보트 프라이빗 투어, 참섬 1박 2일 체험.</p>
      <p>✅ 미니밴 호텔 픽업 &amp; 스피드보트 이동 · ✅ 스쿠버 또는 스노클링 장비 + 전문 가이드 · ✅ 배 위에서 커피, 차 &amp; 간식 · ✅ 해변에서 전통 베트남식 점심 (육류, 해산물 또는 채식) · ✅ 해먹 자유 시간 + 수영</p>
      <p><strong>일정:</strong> 7:00–7:40 호텔 픽업 · 8:00 참섬으로 출항 · 9:30–10:30 첫 번째 다이빙/스노클링 · 10:30–10:50 간식과 휴식 · 11:00–12:00 두 번째 다이빙/스노클링 · 12:30 바이총 해변 도착 · 13:00 점심 &amp; 해변 시간 · 14:15–14:45 출발 · 16:00–16:30 호텔 도착.</p>
