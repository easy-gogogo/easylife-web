# Über uns & Kontakt (Koreanisch)
meta:
  title: "Lan & Martin 소개 – EasyLife 호이안 | 연락처"
  description: "호이안 날라니 호스텔과 이지라이프 빌라를 운영하는 베트남–독일 커플 Lan과 Martin을 소개합니다. WhatsApp, Zalo, Messenger, 이메일로 연락하세요."
hero:
  eyebrow: 소개 & 연락처
  title: "안녕하세요, Lan & Martin이에요"
  lead: "10년 넘게 게스트를 맞이해 온 베트남–독일 커플이에요."
story:
  - "게스트들은 오래, 때로는 몇 달씩 머물러요. 액티비티를 좋아하는 분도, 그냥 이야기 나누며 쉬고 싶은 분도 있죠. 저희는 지금 하는 일이 정말 행복해요 — 세상과 사람들에 대해 궁금한 게 많은 분들에게 늘 둘러싸여 있으니까요."
  - "처음엔 날라니 홈스테이 & 호스텔로 시작했어요. 첫해에만 게스트들이 5성 후기를 100개 넘게 남겨 주셨죠. 그다음 조금 더 프라이빗한 공간을 원하는 분들을 위한 소규모 호텔 이지라이프 빌라를 열었고, 게스트들이 호이안을 제대로 즐길 수 있도록 대여 서비스와 투어 카탈로그도 만들었어요."
values:
  title: 저희가 지키는 것
  items:
    - { title: 높은 기준, text: "혼자, 커플, 가족 모두를 위해 늘 깨끗한 객실. 새 집이라 정말 아늑해요." }
    - { title: 어울림 & 편안함, text: "파티하고 싶다면 즐기세요. 쉬고 싶다면 저희가 챙길게요. 모두가 편안한 공간을 함께 만들어요." }
    - { title: 탐험, text: "여행을 200% 즐길 수 있는 꿀팁을 드려요. 해변, 강, 올드타운이 가깝고 다낭 공항에서 45분이에요." }
