# Reisetipps-Übersicht (Koreanisch)
meta:
  title: "베트남 여행 팁 & FAQ – 비자, 여행 시기, 환전, 교통 | EasyLife 호이안"
  description: "베트남 여행에서 가장 많이 묻는 질문 20가지, 호이안의 란과 마틴이 답합니다: 비자, 여행하기 좋은 시기, 예산, QR 결제, 안전, 오토바이, 유심 – 해변, 일몰, 다낭 공항 이동 팁까지."
hero:
  eyebrow: 여행 팁 · 현지인이 알려주는
  title: "베트남 & 호이안 여행 팁"
  lead: "손님들이 매일 묻는 질문에 제대로 답했습니다. 비자와 여행 시기부터 해변과 공항 가는 길까지."
  alt: "해 질 녘 호이안 구시가지의 지붕들"
articles: 여행 가이드
faq:
  title: "베트남 여행: 가장 많이 묻는 질문 20가지"
  intro: "가장 자주 받는 질문에 대한 답변과, 호이안에서 저희가 도와드릴 수 있는 방법을 정리했습니다. 입국 규정은 바뀔 수 있으니 출발 전 외교부 해외안전여행 또는 주한 베트남 대사관에서 꼭 확인하세요."
  updated: "업데이트: 2026년 9월"
  tipLabel: "저희 팁:"
  more:
    title: "궁금한 점이 더 있으신가요?"
    text: "메시지를 보내 주세요 – 란과 마틴이 영어, 독일어 또는 베트남어로 직접 답해 드립니다."
    wa: 베트남 여행에 관한 질문
  groups:
    - id: entry
      title: 입국 & 비자
      items:
        - id: visa
          q: "베트남에 가려면 비자가 필요한가요?"
          a: "대한민국 국민은 최대 45일까지 무비자로 체류할 수 있습니다(현재 2028년 3월까지 적용). 45일보다 오래 머물려면 출발 전에 온라인으로 전자비자(e-Visa)를 신청하세요. 전자비자는 최대 90일간 유효하며 단수 또는 복수 입국으로 받을 수 있습니다. 반드시 공식 사이트 evisa.gov.vn에서만 신청하세요."
        - id: passport
          q: "여권 유효기간은 얼마나 남아 있어야 하나요?"
          a: "입국 시 여권 유효기간이 귀국 예정일 기준으로 최소 6개월 이상 남아 있어야 하고, 입국 도장을 찍을 빈 페이지가 한 장 이상 있어야 합니다."
    - id: timing
      title: 여행 시기 & 루트
      items:
        - id: best-time
          q: "베트남 여행하기 가장 좋은 시기는 언제인가요?"
          a: "베트남은 남북으로 길어 세 가지 기후대가 있습니다. 전국을 여행한다면 봄(3~4월)과 가을(9~11월)이 가장 좋습니다. 북부는 겨울에 꽤 쌀쌀하고, 남부는 일 년 내내 열대 기후입니다."
          tip: "호이안은 2월부터 8월까지가 가장 건조하고 맑습니다 – 해변과 SUP 선셋을 즐기기에 딱 좋은 시기예요."
          links:
            - { to: sup, label: "선셋 SUP" }
            - { to: "tip:sunset", label: "호이안 일몰 명소" }
        - id: rainy-season
          q: "우기에 여행해도 괜찮을까요?"
          a: "네. 우기에는 대부분 오후에 짧고 강한 소나기가 내린 뒤 다시 해가 납니다. 다만 중부 베트남(호이안, 다낭, 후에)은 10~11월에 태풍과 며칠씩 이어지는 홍수가 생길 수 있습니다."
          tip: "호이안에 비가 온다면? 쿠킹 클래스, 등불 만들기, 커피 클래스는 어떠세요 – 대부분 픽업 포함으로 저희가 예약해 드립니다."
          links:
            - { to: activities, hash: cooking-class, label: "쿠킹 클래스" }
            - { to: activities, hash: lantern-making, label: "등불 만들기" }
            - { to: activities, label: "모든 액티비티" }
        - id: duration
          q: "베트남 여행은 며칠 정도가 좋을까요?"
          a: "하노이, 하롱베이, 호이안, 호치민 같은 주요 명소를 빠르게 둘러보려면 최소 2주가 필요합니다. 여유 있게 여행하려면 3~4주가 이상적입니다."
          tip: "호이안은 베트남의 딱 중간에 있습니다. 구시가지, 해변, 논길, 미선 유적이나 바나힐 투어까지 즐기려면 최소 3~4박을 추천해요."
          links:
            - { to: villa, label: "EasyLife 빌라" }
            - { to: hostel, label: "날라니 호스텔" }
            - { to: activities, hash: my-son, label: "미선 유적 투어" }
        - id: direction
          q: "북쪽에서 남쪽, 남쪽에서 북쪽 중 어느 방향이 좋을까요?"
          a: "둘 다 가능하며 항공편에 따라 정하는 경우가 많습니다. 날씨를 기준으로 삼는 것도 좋은 방법입니다. 봄에 여행한다면 따뜻한 남부에서 시작해 점점 따뜻해지는 북부로 올라가세요."
          tip: "호이안은 완벽한 중간 기착지입니다. 저희 슬리핑 버스는 북쪽(후에, 퐁냐, 닌빈, 하노이)과 남쪽(꾸이년, 나짱, 달랏, 사이공)으로 운행하며 숙소 무료 픽업이 포함됩니다."
          links:
            - { to: transport, hash: bus-times, label: "버스 시간표" }
    - id: money
      title: 돈 & 결제
      items:
        - id: currency
          q: "어떤 화폐를 쓰고, 현지에서는 어떻게 결제하나요?"
          a: "화폐는 베트남 동(VND)입니다. 원화나 달러는 일상에서 거의 받지 않습니다. 현금 외에 QR 코드 결제(VietQR)가 매우 널리 쓰여 작은 노점에서도 가능합니다. Moreta Pay 같은 여행자용 앱을 쓰면 베트남 은행 계좌가 없는 외국인도 스마트폰으로 현지 QR 코드를 스캔해 결제할 수 있습니다."
        - id: budget
          q: "하루 예산은 얼마나 필요한가요?"
          a: "베트남은 물가가 매우 저렴합니다. 배낭여행자는 호스텔, 교통, 길거리 음식 포함 하루 약 30~50유로(약 35~55달러)면 충분합니다. 부티크 호텔과 국내선을 이용하는 편안한 여행이라면 1인당 하루 약 70~120유로를 예상하세요."
          tip: "알뜰하게: 조식 포함 날라니 호스텔 도미토리. 더 편안하게: 발코니와 수영장이 있는 EasyLife 빌라. 직접 예약하면 두 곳 모두 10% 할인됩니다."
          links:
            - { to: hostel, hash: book, label: "날라니 호스텔 직접 예약" }
            - { to: villa, hash: book, label: "EasyLife 빌라 직접 예약" }
        - id: cash
          q: "현금을 많이 가져가야 하나요, 신용카드면 충분한가요?"
          a: "큰 호텔과 레스토랑은 신용카드를 받고 QR 결제도 빠르게 늘고 있습니다. 하지만 시장, 택시, 작은 가게에서는 여전히 현금이 필요합니다. 도착 후 바로 ATM에서 베트남 동을 인출하는 것이 가장 편합니다."
        - id: tipping
          q: "베트남에서는 팁을 줘야 하나요?"
          a: "베트남에는 원래 팁 문화가 없지만 관광지에서는 자리 잡았습니다. 좋은 레스토랑이나 만족스러운 가이드, 기사에게 5~10% 정도 주면 고마워합니다."
    - id: health
      title: 안전 & 건강
      items:
        - id: safety
          q: "베트남은 안전한가요? 여성 혼자 여행해도 괜찮을까요?"
          a: "네. 베트남은 동남아시아에서 가장 안전한 나라 중 하나이며 관광객을 대상으로 한 강력 범죄는 매우 드뭅니다. 여성 혼자서도 자유롭게 여행할 수 있습니다. 다만 관광지에서는 지나가는 오토바이에서 가방을 낚아채는 소매치기를 조심하세요."
          tip: "날라니 호스텔에는 여성 전용 도미토리도 있습니다."
          links:
            - { to: hostel, hash: rooms, label: "날라니 호스텔 객실" }
        - id: vaccines
          q: "어떤 예방접종이 권장되나요?"
          a: "기본 접종(파상풍, 디프테리아, 소아마비) 외에 A형 간염이 권장되며, 장기 체류 시 B형 간염, 광견병, 장티푸스도 권장됩니다. 일반적인 여행 루트에서 말라리아는 거의 문제가 되지 않습니다. 뎅기열 예방에는 긴 옷과 DEET 성분 모기 기피제가 도움이 됩니다. 출발 전 여행의학 상담을 받아 보세요."
        - id: water
          q: "베트남 수돗물을 마셔도 되나요?"
          a: "아니요, 수돗물은 식수로 적합하지 않습니다. 정수된 물이나 밀봉된 생수만 마시고, 배탈이 잘 나는 편이라면 양치할 때도 생수를 쓰세요. 괜찮은 식당의 얼음은 공장에서 정수한 물로 만들어 안심해도 됩니다."
          tip: "날라니 호스텔에서는 투숙객에게 식수를 무료로 제공합니다."
          links:
            - { to: hostel, label: "날라니 호스텔" }
        - id: street-food
          q: "길거리 음식은 안전한가요?"
          a: "길거리 음식은 베트남 문화의 하이라이트이며 몇 가지만 지키면 안전합니다. 현지인이 많은 곳(회전율이 높고 재료가 신선한 곳)에서 먹고, 쌀국수(퍼), 반미, 분짜처럼 눈앞에서 뜨겁게 바로 조리하는 음식을 고르세요."
          tip: "직접 만들어 보세요: 코코넛 숲 속 Bay Mau 에코 쿠킹 클래스에서 베트남 요리 4가지를 배울 수 있습니다."
          links:
            - { to: activities, hash: cooking-class, label: "호이안 쿠킹 클래스" }
    - id: getting-around
      title: 교통 & 현지 생활
      items:
        - id: travel-options
          q: "베트남 안에서는 어떻게 이동하는 게 좋나요?"
          a: "하노이–다낭처럼 먼 거리는 국내선이 가장 빠르고 저렴합니다. 중거리는 야간열차(통일열차)나 편안한 슬리핑 버스가 좋습니다. 도시 안에서는 Grab 같은 차량 호출 앱이 가장 편합니다."
          tip: "다낭 공항에서 호이안까지는 저희 셔틀버스나 전용 차량을 이용하세요. 다음 여행지로 가는 슬리핑 버스도 숙소 픽업 포함으로 예약해 드립니다."
          links:
            - { to: "tip:airport", label: "다낭 공항에서 호이안 가기" }
            - { to: transport, hash: shuttles, label: "셔틀 & 전용 차량" }
            - { to: transport, hash: bus-times, label: "슬리핑 버스 예약" }
        - id: scooter
          q: "오토바이를 빌려도 될까요?"
          a: "운전 경험이 많고 알맞은 면허가 있을 때만 추천합니다. 교통이 매우 복잡해 초보자는 사고 위험이 큽니다. 또한 오토바이 종류가 포함된 국제운전면허증이 꼭 필요하며, 없으면 사고 시 여행자 보험이 적용되지 않을 수 있습니다."
          tip: "경험이 많고 알맞은 면허가 있다면 저희에게서 하루 150,000동부터 오토바이를 빌리세요 – 모든 크기, 전기 또는 가솔린. 직접 운전이 부담된다면 이지라이더가 하이반 고개를 넘어 후에까지 태워 드리고, 논길은 자전거로 둘러볼 수 있어요."
          links:
            - { to: motorbikes, label: "오토바이 대여" }
            - { to: transport, hash: easy-rider, label: "이지라이더 투어" }
            - { to: bicycles, label: "자전거 대여" }
        - id: crossing
          q: "베트남 도시에서 길은 어떻게 건너나요?"
          a: "처음에는 용기가 좀 필요합니다. 천천히 일정한 속도로 걸어가고, 갑자기 멈추거나 뛰지 마세요. 오토바이 운전자들은 보행자를 예측해서 피해 가는 데 익숙합니다."
          tip: "조용한 길을 원한다면 자전거를 타세요. 논길까지 10분이면 가고, EasyLife 빌라 투숙객은 자전거가 무료입니다."
          links:
            - { to: bicycles, label: "자전거 대여" }
        - id: sim
          q: "현지 유심이 필요한가요?"
          a: "네, 길 찾기와 앱 사용을 위해 강력히 추천합니다. 현지 유심(예: Viettel)이나 미리 구매하는 eSIM(예: Airalo)은 매우 저렴하고 여행을 훨씬 편하게 해 줍니다."
          tip: "EasyLife 빌라는 빠른 와이파이와 객실 책상을 갖추고 있어 원격 근무에도 좋습니다."
          links:
            - { to: villa, label: "EasyLife 빌라" }
        - id: apps
          q: "베트남 여행 필수 앱은 무엇인가요?"
          a: "이동과 음식 배달은 Grab 또는 Be, 길 찾기는 Google 지도, 번역은 Google 번역(또는 파파고), QR 결제는 Moreta Pay 같은 앱이 유용합니다. 호텔, 가이드, 기사와는 주로 Zalo로 연락합니다."
          tip: "저희에게는 Zalo나 WhatsApp으로 연락하세요 – 객실, 버스표, 투어 모두 가능합니다."
          links:
            - { to: zalo, label: "Zalo" }
            - { to: whatsapp, label: "WhatsApp" }
        - id: plugs
          q: "베트남 콘센트는 어떤 형태인가요?"
          a: "전압은 220V입니다. 콘센트는 주로 A, C, F 타입이 섞인 겸용 형태입니다. 한국에서 쓰는 둥근 핀 플러그는 대부분 그대로 사용할 수 있지만, 콘센트에 따라 헐거울 수 있으니 작은 여행용 어댑터를 챙기면 편합니다."
