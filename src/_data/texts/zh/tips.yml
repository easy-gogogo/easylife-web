faq:
  title: "越南旅行：最常见的20个问题"
  intro: "这里是我们最常被问到的问题和答案，以及我们在会安能为你提供的帮助。入境规定可能会变化，出发前请务必向越南驻华使领馆或官方渠道确认。"
  updated: "更新：2026年9月"
  tipLabel: "我们的建议："
  more:
    title: "还有其他问题？"
    text: "给我们发消息吧——Lan 和 Martin 会亲自用英语、德语或越南语回复你。"
    wa: 关于越南旅行的问题
  groups:
    - id: entry
      title: 入境与签证
      items:
        - id: visa
          q: "去越南需要签证吗？"
          a: "中国大陆护照持有人需要签证。最简单的方式是出发前在线申请电子签证（e-Visa），有效期最长90天，可选单次或多次入境。请只通过官方网站 evisa.gov.vn 申请，注意避开非官方代办网站。部分欧洲国家、日本和韩国公民可免签停留最长45天。"
        - id: passport
          q: "护照需要多长的有效期？"
          a: "入境时，护照有效期需在计划离境日期之后至少还有六个月，并且至少有一页空白页用于盖入境章。"
    - id: timing
      title: 旅行季节与路线
      items:
        - id: best-time
          q: "什么时候去越南最好？"
          a: "越南国土狭长，有三种不同的气候区。如果要游览全国，春季（3月至4月）和秋季（9月至11月）是最佳时间。北部冬季可能相当凉，南部则全年都是热带气候。"
          tip: "会安本地2月至8月最干燥、阳光最充足——非常适合去海滩，或在桨板上看日落。"
          links:
            - { to: sup, label: "日落桨板" }
            - { to: "tip:sunset", label: "会安最美日落地点" }
        - id: rainy-season
          q: "雨季去越南值得吗？"
          a: "值得。雨季通常是下午一阵短暂的强降雨，之后又会放晴。例外是越南中部（会安、岘港、顺化）：10月至11月可能出现台风和持续数天的洪水。"
          tip: "会安下雨天？可以参加烹饪课、灯笼制作或咖啡课——我们帮你预订，很多还包含接送。"
          links:
            - { to: activities, hash: cooking-class, label: "烹饪课" }
            - { to: activities, hash: lantern-making, label: "灯笼制作" }
            - { to: activities, label: "全部活动" }
        - id: duration
          q: "去越南旅行需要安排多少天？"
          a: "想快速看遍主要景点（例如河内、下龙湾、会安、胡志明市），至少需要两周。三到四周最理想，可以更轻松深入地游览。"
          tip: "会安正好位于越南中部。建议在这里至少住三到四晚：古镇、海滩、稻田，还可以去美山圣地或巴拿山一日游。"
          links:
            - { to: villa, label: "EasyLife 别墅" }
            - { to: hostel, label: "Nalani 青年旅舍" }
            - { to: activities, hash: my-son, label: "美山圣地一日游" }
        - id: direction
          q: "从北往南还是从南往北旅行更好？"
          a: "两个方向都可以，通常取决于航班。也可以参考天气：如果在春季出行，最好从温暖的南部出发，再随着北方天气回暖一路北上。"
          tip: "会安是完美的中转站：我们的卧铺大巴从这里北上（顺化、峰牙、宁平、河内）和南下（归仁、芽庄、大叻、西贡），并提供住处免费接客。"
          links:
            - { to: transport, hash: bus-times, label: "大巴时刻表" }
    - id: money
      title: 货币与支付
      items:
        - id: currency
          q: "越南用什么货币？当地怎么付款？"
          a: "越南货币是越南盾（VND）。日常生活中基本不收人民币、美元或欧元。除了现金，二维码支付（VietQR）非常普及，连小摊都能扫码。通过 Moreta Pay 等面向旅行者的应用，没有越南银行账户的外国人也可以用手机扫描本地二维码付款。"
        - id: budget
          q: "每天需要多少预算？"
          a: "越南消费很低。背包客每天约30至50欧元（约35至55美元）就足够支付青旅、交通和街头小吃。如果想住精品酒店、坐国内航班，舒适游每人每天约需70至120欧元。"
          tip: "经济实惠：Nalani 青年旅舍床位，含早餐。更舒适：EasyLife 别墅带阳台和泳池的客房。直接预订两处都可享九折优惠。"
          links:
            - { to: hostel, hash: book, label: "直接预订 Nalani 青年旅舍" }
            - { to: villa, hash: book, label: "直接预订 EasyLife 别墅" }
        - id: cash
          q: "需要带很多现金吗？还是信用卡就够了？"
          a: "大型酒店和餐厅接受信用卡，扫码支付也在快速普及。但在市场、出租车和小店，现金仍然很重要。最方便的方法是抵达后直接在ATM取越南盾。"
        - id: tipping
          q: "在越南需要给小费吗？"
          a: "越南传统上没有给小费的习惯，但在旅游区已经很常见。在较好的餐厅，或对服务好的导游和司机，给5%至10%会很受欢迎。"
    - id: health
      title: 安全与健康
      items:
        - id: safety
          q: "越南安全吗？女生独自旅行可以吗？"
          a: "安全。越南是东南亚最安全的国家之一，针对游客的暴力犯罪非常少见。女生独自旅行也可以自由出行。主要需要注意的是扒窃，比如在旅游区被路过的摩托车抢包。"
          tip: "Nalani 青年旅舍除了混合宿舍，也有女生专用宿舍。"
          links:
            - { to: hostel, hash: rooms, label: "Nalani 青年旅舍房型" }
        - id: vaccines
          q: "建议接种哪些疫苗？"
          a: "除常规疫苗（破伤风、白喉、脊髓灰质炎）外，建议接种甲肝疫苗；长期停留还建议接种乙肝、狂犬病和伤寒疫苗。常规旅游路线上疟疾很少见。预防登革热要做好防蚊（穿长袖、使用含DEET的驱蚊剂）。出发前请咨询旅行医学门诊。"
        - id: water
          q: "越南的自来水能喝吗？"
          a: "不能，自来水不适合直接饮用。只喝过滤水或密封瓶装水；肠胃敏感的话，刷牙也最好用瓶装水。正规餐厅的冰块用工业过滤水制成，可以放心。"
          tip: "Nalani 青年旅舍为住客免费提供饮用水。"
          links:
            - { to: hostel, label: "Nalani 青年旅舍" }
        - id: street-food
          q: "街头小吃安全吗？"
          a: "街头小吃是越南文化的一大亮点，只要注意几点就很安全：去本地人多的摊位（翻台快、食材新鲜），选择当面现做、热气腾腾的食物，比如河粉、越式法棍和烤肉米线。"
          tip: "亲手学做经典越南菜：在椰林里的 Bay Mau 生态烹饪课，你会学做四道越南菜。"
          links:
            - { to: activities, hash: cooking-class, label: "会安烹饪课" }
    - id: getting-around
      title: 交通与当地生活
      items:
        - id: travel-options
          q: "在越南境内怎么出行最方便？"
          a: "长途（例如河内到岘港）坐国内航班最快，也很便宜。中程可以选择夜车（统一铁路）或舒适的卧铺大巴。在城市里，用 Grab 等网约车应用最方便。"
          tip: "从岘港机场到会安，可以坐我们的机场班车或包车。继续旅行时，我们帮你预订卧铺大巴，含住处接送。"
          links:
            - { to: "tip:airport", label: "岘港机场到会安" }
            - { to: transport, hash: shuttles, label: "班车与包车" }
            - { to: transport, hash: bus-times, label: "预订卧铺大巴" }
        - id: scooter
          q: "应该租摩托车吗？"
          a: "只有驾驶经验丰富并持有合适驾照时才建议。越南交通混乱，新手发生事故的风险很高。此外需要包含摩托车类别的国际驾照，否则出事后保险可能不予赔付。"
          tip: "有经验且驾照合规？可以在我们这里租摩托车，每天15万越南盾起，各种尺寸，电动或燃油均有。不想自己骑？Easy Rider 司机可以载你翻越海云岭去顺化，或者骑自行车逛稻田。"
          links:
            - { to: motorbikes, label: "租摩托车" }
            - { to: transport, hash: easy-rider, label: "Easy Rider 之旅" }
            - { to: bicycles, label: "租自行车" }
        - id: crossing
          q: "在越南城市里怎么过马路？"
          a: "一开始需要一点勇气：以缓慢、稳定、可预测的速度往前走，千万不要突然停下或奔跑。摩托车司机习惯提前绕开行人。"
          tip: "想要更清静，就骑自行车吧——十分钟就到稻田，EasyLife 别墅住客免费使用自行车。"
          links:
            - { to: bicycles, label: "租自行车" }
        - id: sim
          q: "需要买当地电话卡吗？"
          a: "强烈建议，方便导航和使用各种应用。当地电话卡（例如 Viettel）或提前购买的 eSIM 都非常便宜，会让旅途轻松很多。"
          tip: "EasyLife 别墅有高速Wi-Fi，每个房间都有书桌，远程办公也很合适。"
          links:
            - { to: villa, label: "EasyLife 别墅" }
        - id: apps
          q: "去越南必备哪些应用？"
          a: "出行和外卖用 Grab 或 Be，导航用 Google 地图，翻译用 Google 翻译，扫码支付可以用 Moreta Pay 等应用。与酒店、导游和司机沟通大多使用 Zalo。"
          tip: "你可以通过 Zalo 或 WhatsApp 联系我们——订房、买车票、订行程都可以。"
          links:
            - { to: zalo, label: "Zalo" }
            - { to: whatsapp, label: "WhatsApp" }
        - id: plugs
          q: "越南用什么插头？"
          a: "电压为220伏。插座一般为A、C、F型，常见多用插座。中国的两扁脚插头（A型）通常可以直接使用；三脚插头（I型）插不进去，需要带转换插头。"
