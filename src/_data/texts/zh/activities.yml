    short: 绝对是城里最棒的日落体验！看太阳在河上落下，看渔民准备渔网。
  - id: cooking-class
    title: 七亩椰林生态烹饪课
    price: 每人 520K 越南盾起
    meta:
    - 9:30 / 14:30 开始
    - 最多 12 人
    short: 在河边一座高脚屋烹饪学校学做地道越南菜。自 2002 年起，这里的厨师已带领客人学做 4 道经典菜肴，并游览七亩（Bay Mau）椰林。
    full: |-
      <p><strong>烹饪课 + 簸箕船：</strong>每人 670,000 越南盾 · 上午团 8:20–13:00 · 下午团 13:35–18:00。</p>
      <p><strong>仅烹饪课（不含簸箕船）：</strong>每人 520,000 越南盾——9:30 或 14:30 开始。</p>
      <p><strong>4 道菜烹饪课包括：</strong></p>
      <ul>
      <li>越南煎饼 Bánh xèo（猪肉虾仁脆米饼）</li>
      <li>牛肉河粉 Phở bò（香料浓汤）</li>
      <li>越南鲜春卷 Gỏi cuốn（虾仁和猪肉）</li>
      <li>南部牛肉拌米线 Bún bò Nam Bộ</li>
      <li>另有自制百香果汁、酸甜鱼露、海鲜酱和时令水果</li>
      </ul>
      <p><strong>亲手体验：</strong>用石臼舂米筛米、用木杵磨米、手工制作米纸。</p>
      <p><strong>簸箕船套餐（Bay Mau Eco Cooking Class）：</strong>上午团 8:20–13:00 / 下午团 13:35–18:00，每人 670K，儿童有优惠。包括逛市场、乘传统竹编簸箕船游览七亩椰林（含捉螃蟹和簸箕船表演）、4 道菜烹饪课、共享餐食以及酒店接送。</p>
      <p><strong>儿童政策：</strong>3 岁以下免费 · 3–9 岁半价 · 10 岁及以上全价。</p>
      <p>独立厨房，可满足特殊饮食需求（素食、无麸质等），会安古城酒店接送，结束时赠送食谱和小礼物。</p>
  - id: cham-island-snorkeling
    title: 占婆岛浮潜 + 潜水
    price: 每人 150 万越南盾起
    meta:
    - 全天，7:00 接人
    - 占婆岛
    short: 探索占婆岛水上与水下的美景。全天导游陪同，可浮潜或水肺潜水，还有海滩时光和美味的本地午餐。
    full: |-
      <p><strong>水肺潜水（每人）：</strong></p>
      <ul>
      <li>持证潜水员：2,400,000 越南盾——2 次导潜，全套装备，快艇及酒店接送</li>
      <li>无证潜水员：2,100,000 越南盾——1 次体验潜水 + 额外浮潜，全套装备及教学</li>
      <li>仅浮潜：1,500,000 越南盾——绚丽珊瑚礁，优质装备，无需潜水经验</li>
      </ul>
      <p><strong>另可提供：</strong>PADI 潜水课程（各级别）、快艇私人游、占婆岛两天一夜体验。</p>
      <p>✅ 小巴酒店接送及快艇 · ✅ 潜水或浮潜装备 + 专业导游 · ✅ 船上咖啡、茶和小吃 · ✅ 海滩上的传统越南午餐（肉类、海鲜或素食）· ✅ 吊床自由时间 + 游泳</p>
      <p><strong>行程：</strong>7:00–7:40 酒店接人 · 8:00 乘船前往占婆岛 · 9:30–10:30 第一次潜水/浮潜 · 10:30–10:50 休息吃小吃 · 11:00–12:00 第二次潜水/浮潜 · 12:30 抵达 Bai Chong 海滩 · 13:00 午餐和海滩时光 · 14:15–14:45 返程 · 16:00–16:30 回到酒店。</p>
  - id: coffee-class
    title: 咖啡课 — 5 种越南咖啡
    price: 350,000 越南盾
    meta:
    - 2 小时 · 上午 10/11 点，下午 2/3 点
    short: 亲手冲泡 5 种传统越南咖啡。
    full: |-
      <ul>
      <li>越南滴滤壶冲泡的传统黑咖啡</li>
      <li>越南炼乳咖啡</li>
      <li>顺化宫廷盐咖啡</li>
      <li>会安椰子咖啡</li>
      <li>河内鸡蛋咖啡</li>
      </ul>
      <p>时长：2 小时 · 价格：350,000 越南盾</p>
  - id: lantern-making
    title: 灯笼制作课
    price: 250K–350K 越南盾
    meta:
    - 2–3 小时，时间灵活
    - 3 岁以上
    short: 走进色彩缤纷的越南手工艺世界，亲手做一盏可折叠的丝绸灯笼——独一无二的纪念品，也是会安之旅难忘的回忆！
    full: |-
      <p><strong>完整课程 – 3 小时：</strong>亲自完成全部 11 个步骤——用线绑竹条、把骨架弯成“日出”形状、固定在金属圈上、挑选布料、裁剪布料、把布料绷上骨架、包好侧面、装饰上下两端、系上流苏、完工。</p>
      <p><strong>快速课程 – 2 小时：</strong>从第 5 步开始——骨架已做好，您只需挑选并贴上布料。</p>
      <p><strong>开始时间：</strong>灵活，白天任何时间均可。<strong>价格：</strong>快速课程 250,000 越南盾 · 完整课程 350,000 越南盾。</p>
      <p>包含：亲手制作的可折叠丝绸灯笼 · 越南迎宾茶 · 小纪念品 · 英语导游 · 本地手艺人一对一指导。</p>
      <p>老少皆宜——独自旅行者、朋友结伴，甚至 3 岁的小朋友都能参加！</p>
  - id: langur-monkeys
    title: 清晨观赏白臀叶猴
    price: 每人 55 美元
    meta:
    - 3 小时 · 6:30 出发
    - 小团
    - 野生动物
    short: 清晨探访山茶半岛（Son Tra）自然保护区，在经验丰富的护林员和野生动物摄影师陪同下，观察濒危的红腿白臀叶猴在自然栖息地中的生活。
    full: |-
      <p>根据季节，6:30–6:45 之间从酒店接您出发。清晨是红腿白臀叶猴最活跃的时候。沿着茂密的丛林小径散步，呼吸清新的山间空气，学习如何发现藏在树冠里的动物。</p>
      <p><strong>行程亮点：</strong></p>
      <ul>
      <li>以轻松的短途步行探索山茶半岛自然保护区。</li>
      <li>坐在专业司机的摩托车后座出行（可应要求改乘汽车，需另付费）。</li>
      <li>由经验丰富、践行负责任观察的护林员/讲解员带领。</li>
      </ul>
      <p><strong>费用包含：</strong>岘港地区酒店接送 · 饮用水和新鲜水果 · 望远镜或单筒观察镜。</p>
- id: workshops
  title: 手工艺与创意课程
  items:
  - id: woodart
    title: Woodart 木雕课
    price: 600,000 越南盾
    meta:
    - 3 小时 · 9:00 / 14:00
    - YouTube 订阅超 100 万
    short: YouTube 订阅超过 100 万就是最好的证明！与“Woodart Vietnam”背后的顶尖木雕艺术家一起创作，参加 3 小时课程，或最长 28 天的专业课程。
    full: |-
      <p><strong>课程时间与时长：</strong>每天两场，每场 3 小时（上午 9:00 | 下午 14:00）。</p>
      <p><strong>体验与亮点：</strong></p>
      <ul>
      <li>在资深手艺人的悉心指导下，创作属于自己的独特木雕作品。</li>
      <li>可选现成图案或自行设计——从传统纹样、花卉叶片到动漫角色和神话生物。</li>
      <li>参观收藏数百件精美作品的木雕工坊。</li>
      <li>欣赏 Au Lac Artisan 的木艺收藏，其 YouTube 频道“Woodart Vietnam”拥有超过 100 万订阅者。</li>
      </ul>
      <p><strong>价格：</strong>每人 600,000 越南盾。</p>
      <p><em>名额有限——今天就来预订吧！更长的专业课程（最长 28 天）请咨询我们。</em></p>
  - id: woodcarving
    title: 木雕课 — 漂流木村
    price: 400K–500K 越南盾
    meta:
    - 2–2.5 小时 · 8:30 / 14:00
    - 最多 25 人
    short: 远离喧嚣街道，沉浸在地道的越南手工艺中！在轻松的露天工坊里，跟着本地手艺人把天然漂流木雕刻成属于您的手工纪念品。
    full: |-
      <p>每天两场，每场 2–2.5 小时：上午 8:30，下午 14:00。每场最多 25 人。</p>
      <p><strong>价格：</strong>成人 500,000 越南盾 · 儿童 400,000 越南盾。</p>
      <p>包含：所有优质木料、全套工具、手艺人逐步指导、清爽迎宾饮品，以及可带走的完成作品。</p>
      <p>非常适合新手、家庭和热爱创作的人。</p>
  - id: leather
    title: 皮具课
    price: 每人 26 美元起
    meta:
    - 2 小时至 2 天，视课程而定
    short: 四个受欢迎的课程级别——从 2 小时做一个简单卡包，到 2 天做一个属于自己的双肩包。
    full: |-
      <ul>
      <li><strong>快速课（2 小时）：</strong>简单卡包或钥匙扣（自行设计或用我们的款式）——每人 26 美元</li>
      <li><strong>基础课（4 小时）：</strong>护照夹、简单钱包、零钱包、长款钱包或简单包袋（我们的款式）——每人 45 美元</li>
      <li><strong>进阶课（1 天）：</strong>设计更复杂的简单包袋，或钱包 + 钥匙扣 + 卡包套装——每人 96 美元</li>
      <li><strong>高级课（2 天）：</strong>简单双肩包或手提包——每人 196 美元</li>
      </ul>
      <p>在 2 小时课程中可以自己设计，或参考我们的钱包款式——想看样品请问我们。</p>
  - id: bamboo
    title: 竹艺课
    price: 790K 越南盾
    meta:
    - 3 小时 · 9–12 点 / 14–17 点
    - 椰林村
    short: 河边一座摆满艺术品的大工坊。Tan 用竹子做出的东西令人惊叹——2 米长的鱼、大猫头鹰，甚至自行车！
    full: |-
      <p>就算不上竹艺课，这里也值得一去。工坊位于椰林村，靠近簸箕船。课程中可以选择制作不同的作品——我们家里也有几盏竹灯，欢迎来问。</p>
      <p>时长：3 小时 · 上午 9–12 点，下午 14–17 点 · 价格：790,000 越南盾</p>
  - id: jewelry
    title: 首饰制作课
    price: 110–150 万越南盾
    meta:
    - 10–12 点 / 14–16 点
    short: 在会安释放创意，亲手制作首饰。在资深手艺人指导下，把原银打造成独一无二的作品——戒指、吊坠或手链，展现您的个人风格。
    full: |-
      <p>从塑形、焊接到抛光，每一步都让您沉浸在传统越南银饰工艺中。无需任何经验——只要带上想象力，就能带走一件手工珍品和难忘的回忆。</p>
      <p>价格：1,100,000 – 1,500,000 越南盾 · 时间：上午 10–12 点或下午 14–16 点。</p>
- id: tours
  title: 一日游与户外探险
  items:
  - id: sea-trek
    title: 海底漫步 — Sea Trek®
    price: 每人 890K 越南盾起
    meta:
    - 7:30–8:15 接人
    - 会安 / 岘港 → 占婆岛
    short: 从会安或岘港乘快艇前往被联合国教科文组织认定的占婆岛。游泳、浮潜，并在导游带领下于五彩鱼群和珊瑚间“海底漫步”。
    full: |-
      <p>✅ 导游（英语）· ✅ 接送 · ✅ 快艇往返 · ✅ 海底漫步及全套浮潜装备 · ✅ 午餐 · ✅ 门票 · ✅ 旅游保险</p>
      <p><strong>行程：</strong>7:30–8:15 从住处接您，前往会安 Cua Dai 码头 · 9:00 乘快艇 20 分钟到占婆岛 · 9:20 抵达 Hon Nhon 海滩，自由进行海底漫步和浮潜 · 11:00 在 Bai Chong 海滩独特的生态区享用海鲜午餐，继续游泳或休息 · 14:00 返回 Cua Dai 码头。</p>
      <p><strong>价格：</strong>成人 1,600,000 越南盾 · 8–12 岁儿童 1,250,000 越南盾 · 4–7 岁儿童（仅浮潜）890,000 越南盾 · 4 岁以下免费。</p>
  - id: atv-tour
    title: 全地形车（ATV）半日游
    price: 每人 165 万越南盾起
    meta:
    - 5 小时 · 8:30 / 13:30 出发
    short: 驾驶全地形车穿越风景如画的村庄和丛林，享用烧烤午餐，沿途还有许多难忘的拍照点。
    full: |-
      <p><strong>费用包含：</strong>接人并前往农场（50 分钟）· 介绍和安全讲解（30 分钟，含头盔）· 驾驶 ATV 穿越村庄和丛林（1.5 小时），拍下难忘照片 · 烧烤午餐或素食（30 分钟）· 返程（50 分钟）· 3 杯饮品。</p>
      <p><strong>价格：</strong>双人共乘（2 人 1 车）每人 1,650,000 越南盾 · 单人驾驶每人 2,150,000 越南盾。</p>
      <p>6–8 岁儿童：优惠 20%（必须作为乘客与父母同乘）。单人驾驶需年满 16 岁。</p>
      <p><strong>建议携带：</strong>舒适衣物和包脚鞋、防晒霜和太阳镜、相机或 GoPro（可选），以及冒险精神！</p>
  - id: ba-na-hills
    title: 巴拿山 — 佛手金桥与龙桥
    price: 159 万越南盾起
    meta:
    - 全天行程
    - 夜游行程
    - 海拔 1,487 米
    short: 乘坐东南亚最现代化的缆车前往佛手金桥，漫步法国村，畅玩梦幻乐园——可选全天行程，或下午出发、晚上拍摄龙桥夜景的行程。
    full: |-
      <p><strong>下午 / 夜游行程（11:45 出发）：</strong>乘缆车上巴拿山，游览佛手金桥、爱情花园（Le Jardin D'Amour）、灵应寺；换乘第二段缆车到法国村（街头音乐、艺术家雕像、钟楼、九层女神庙、嘉年华表演）；从 Sun Kingdom 乘熔岩列车（Hellios 瀑布、时光之门、月亮王国）；梦幻乐园（精灵森林、恐龙公园、5D 狂野西部、4D 死亡赛车、3D Mega 360°、地心之旅、侏罗纪公园、跳楼机、鬼屋，以及 90 多项免费游戏）。18:45 返回缆车 · 19:15 拍摄龙桥夜景 · 20:00 送回酒店。</p>
      <p>费用包含：酒店往返接送、英语导游、往返缆车票、自助晚餐、一瓶水。不含：个人消费、饮品、小费。</p>
      <p><strong>全天行程（7:30–8:00 出发）：</strong>同上亮点，另含酒窖参观、90 多道菜的自助午餐。16:45–17:45 返回。</p>
      <p>费用包含：酒店往返接送、英语导游、往返缆车（价值 950,000 越南盾）、自助午餐、瓶装水。不含：蜡像馆、酒窖门票、过山车/有奖攀爬游戏、个人消费。</p>
      <p><strong>价格：</strong>成人（1.4 米以上）1,660,000 / 1,590,000 越南盾 · 儿童（1–1.4 米）1,360,000 / 1,290,000 越南盾 · 1 米以下免费。取消政策：出发前 12 小时收取 20%，出发当天收取 35%。</p>
      <p>小贴士：带件外套御寒——这里海拔 1,487 米！</p>
  - id: my-son
    title: 美山圣地 — 日落团与上午团
    price: 每人 400K 越南盾起
    meta:
    - 上午
    - 日落
    short: 占婆王国的寺庙遗址群，有传统表演，还能在秋盆河上悠闲游船——可选日落团或上午团。
    full: |-
      <p><strong>日落团：</strong>13:00–13:30 导游接您，乘小巴出发 · 在导游讲解下游览美山遗址，观看传统占族表演 · 秋盆河游船 · 18:00–18:30 送回酒店。</p>
      <p>价格：成人（5 岁以上）500,000 越南盾 · 儿童（5 岁以上）400,000 越南盾 · 5 岁以下免费。包含：酒店接送、美山圣地门票、英语导游、传统表演、游船、本地小吃（越南法棍 Bánh mì）、瓶装水。不含：个人消费、150,000 越南盾入场费、小费。当天取消收取 50%。注意：能否看到日落视天气而定。</p>
      <p><strong>上午团：</strong>7:30–8:00 接人，乘小巴出发 · 9:15 游览美山遗址，观看传统占族表演，并亲手制作可带走的米纸 · 11:30 在当地人家中吃午饭 · 13:00 在越南中部最大的河流秋盆河上游船 · 13:30 送回酒店。</p>
      <p>价格：成人（5 岁以上）790,000 越南盾 · 儿童（5 岁以上）590,000 越南盾 · 5 岁以下免费。包含：会安地区酒店接送、门票 + 电瓶车、英语导游、越南风味午餐、米纸制作、瓶装水。当天取消收取 50%。</p>
  - id: bach-ma
    title: 白马国家公园 — 两天一夜徒步露营
    price: 每人 130 美元
    meta:
    - 两天一夜
    - 徒步 10 公里
    short: 远离喧嚣，走进白马国家公园的原始自然——群山全景、清澈的天然湖泊、壮观的瀑布，以及星空下难忘的露营之夜。
    full: |-
      <p><strong>接人时间：</strong>会安 6:30–7:00 · 岘港 7:30–8:00。返回：第二天傍晚。</p>
      <p><strong>亮点：</strong>徒步、游泳、露营、看日出和烧烤派对。</p>
      <p><strong>第一天 — 山顶美景、五湖和杜鹃瀑布：</strong>早上接人前往国家公园 · 车行至 12 公里处，再由经验丰富的本地向导/护林员带领登上最高观景点海望台峰，边吃午餐喝咖啡边欣赏景阳海滩、三江潟湖和求海潟湖的壮丽景色 · 穿越丛林徒步至五湖，可在 5 号湖游泳 · 继续穿过古老雨林，前往高 300 米的壮观杜鹃瀑布 · 晚上：搭营并在星空下烧烤。</p>
      <p><strong>第二天 — 山间日出与返程：</strong>5:30 可选短途步行上海望台峰看日出（视天气而定）· 热茶、清晨林间的声音和新鲜早餐 · 10:00 出发返回岘港 / 会安。</p>
      <p>包含：会安 / 岘港往返接送、本地向导和护林员协助、全部餐食（午餐、烧烤晚餐、早餐，以及咖啡和热茶）、露营装备和搭营、所有国家公园门票及安全保障。</p>
      <p>价格：每人 130 美元。</p>
