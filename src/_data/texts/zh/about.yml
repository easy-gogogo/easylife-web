hero:
  eyebrow: 关于我们与联系方式
  title: "你好，我们是 Lan 和 Martin"
  lead: "一对接待旅行者超过 10 年的越南—德国夫妻。"
story:
  - "我们的客人常常住很久，有时长达几个月。有人爱热闹，有人只想聊聊天、放松一下。我们非常喜欢自己做的事——身边总是围绕着想了解世界、了解世界上的人的朋友。"
  - "我们从 Nalani 青旅民宿起步，仅第一年客人就留下了 100 多条五星好评。之后有了 EasyLife 别墅——为想要多一点私密空间的客人准备的小酒店——还有我们的租赁服务和行程目录，让客人充分享受会安。"
