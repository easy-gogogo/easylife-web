  - id: cooking-class
    title: Bay Mau Öko-Kochkurs
    price: ab 520K VND/Pers.
    meta:
    - Start 9:30 / 14:30 Uhr
    - max. 12 Personen
    short: Entdecke die echte vietnamesische Küche in einer Kochschule auf Stelzen direkt am Wasser. Seit 2002 zeigen die Köche ihren Gästen 4 klassische Gerichte – dazu geht es in den Kokospalmenwald von Bay Mau.
    full: |-
      <p><strong>Kochkurs mit Korbboot:</strong> 670.000 VND/Person · Vormittagstour 8:20–13:00 Uhr · Nachmittagstour 13:35–18:00 Uhr.</p>
      <p><strong>Nur Kochkurs, ohne Korbboot:</strong> 520.000 VND/Person – Start um 9:30 oder 14:30 Uhr.</p>
      <p><strong>Der Kochkurs mit 4 Gängen umfasst:</strong></p>
      <ul>
      <li>Bánh xèo (knusprige Reispfannkuchen mit Schwein &amp; Garnelen)</li>
      <li>Phở bò (Rindernudelsuppe mit Gewürzen)</li>
      <li>Gỏi cuốn (frische Sommerrollen mit Garnelen &amp; Schwein)</li>
      <li>Bún bò Nam Bộ (Salat mit Rind &amp; Reisnudeln)</li>
      <li>Dazu hausgemachter Maracujasaft, süß-saure Fischsauce, Hoisinsauce &amp; Obst der Saison</li>
      </ul>
      <p><strong>Selbst mitmachen:</strong> Reis im Steinmörser stampfen und trennen, Reis mit dem Holzstößel mahlen, Reispapier von Hand herstellen.</p>
      <p><strong>Mit Korbboot (Bay Mau Eco Cooking Class):</strong> Vormittagstour 8:20–13:00 Uhr / Nachmittagstour 13:35–18:00 Uhr, 670K/Person, Kinderrabatt möglich. Inklusive Marktbesuch, Fahrt im traditionellen Bambus-Korbboot durch den Kokospalmenwald von Bay Mau mit Krabbenfischen und Korbboot-Vorführung, Kochkurs mit 4 Gängen, gemeinsames Essen sowie Abholung &amp; Rückfahrt zum Hotel.</p>
      <p><strong>Kinder:</strong> unter 3 Jahren frei · 3–9 Jahre 50 % des Erwachsenenpreises · ab 10 Jahren voller Preis.</p>
      <p>Eigene Küche, besondere Ernährungsweisen willkommen (vegetarisch, glutenfrei usw.), Abholung &amp; Rückfahrt in der Altstadt von Hội An, Rezeptheft &amp; Geschenk zum Abschluss.</p>
  - id: cham-island-snorkeling
    title: Schnorcheln + Tauchen auf Cham Island
    price: ab 1,5 Mio. VND/Pers.
    meta:
    - ganztägig, Abholung 7:00 Uhr
    - Cham Island
    short: Entdecke Cham Island über und unter Wasser. Ganztägige geführte Tour mit Schnorcheln oder Tauchen, Zeit am Strand und leckerem einheimischem Mittagessen.
    full: |-
      <p><strong>Tauchen (pro Person):</strong></p>
      <ul>
      <li>Mit Tauchschein: 2.400.000 VND – 2 geführte Tauchgänge, komplette Ausrüstung, Schnellboot &amp; Hoteltransfer</li>
      <li>Ohne Tauchschein: 2.100.000 VND – 1 Einsteiger-Tauchgang + zusätzlich Schnorcheln, komplette Ausrüstung &amp; Einweisung</li>
      <li>Nur Schnorcheln: 1.500.000 VND – farbenfrohe Korallenriffe, hochwertige Ausrüstung, keine Tauch-Erfahrung nötig</li>
      </ul>
      <p><strong>Außerdem möglich:</strong> PADI-Tauchkurse (alle Stufen), private Touren mit dem Schnellboot, Cham Island mit Übernachtung (2 Tage / 1 Nacht).</p>
      <p>✅ Abholung im Minivan &amp; Schnellboot-Transfer · ✅ Tauch- oder Schnorchelausrüstung + professionelle Guides · ✅ Kaffee, Tee &amp; Snacks an Bord · ✅ Traditionelles vietnamesisches Mittagessen am Strand (Fleisch, Meeresfrüchte oder vegetarisch) · ✅ Freizeit in Hängematten + Baden</p>
      <p><strong>Ablauf:</strong> 7:00–7:40 Abholung am Hotel · 8:00 Abfahrt des Boots nach Cham Island · 9:30–10:30 erster Tauchgang/Schnorcheln · 10:30–10:50 Pause mit Snacks · 11:00–12:00 zweiter Tauchgang/Schnorcheln · 12:30 Ankunft am Bai Chong Beach · 13:00 Mittagessen &amp; Strandzeit · 14:15–14:45 Rückfahrt · 16:00–16:30 zurück am Hotel.</p>
