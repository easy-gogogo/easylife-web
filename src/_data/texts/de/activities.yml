  - id: lantern-making
    title: Laternen-Workshop
    price: 250K–350K VND
    meta:
    - 2–3 Std., flexibel
    - ab 3 Jahren
    short: Tauch ein in die bunte Welt des vietnamesischen Kunsthandwerks und bau deine eigene faltbare Seidenlaterne – ein einzigartiges Souvenir und eine unvergessliche Erinnerung an Hội An!
    full: |-
      <p><strong>Ganzer Kurs – 3 Stunden:</strong> alle 11 Schritte selbst machen – Bambusstäbe mit Faden verbinden, das Gestell zur „Sonnenaufgangs“-Form biegen, am Metallring befestigen, Stoff aussuchen, Stoff zuschneiden, Stoff auf das Gestell spannen, die Seiten bespannen, oben und unten verzieren, die Quaste anbringen, fertigstellen.</p>
      <p><strong>Express-Kurs – 2 Stunden:</strong> Start ab Schritt 5 – das Gestell ist schon fertig, du wählst deinen Stoff und bringst ihn an.</p>
      <p><strong>Beginn:</strong> flexibel, jederzeit tagsüber. <strong>Preise:</strong> Express-Kurs 250.000 VND · Ganzer Kurs 350.000 VND.</p>
      <p>Inklusive: deine handgemachte, faltbare Seidenlaterne · vietnamesischer Willkommenstee · kleines Souvenir · englischsprachiger Guide · Unterstützung durch einheimische Kunsthandwerker.</p>
      <p>Spaß für jedes Alter – Alleinreisende, Freunde oder Kinder ab 3 Jahren!</p>
  - id: langur-monkeys
    title: Languren beobachten am Morgen
    price: 55 $ pro Person
    meta:
    - 3 Std. · Start 6:30 Uhr
    - kleine Gruppen
    - Tierwelt
    short: Erkunde am frühen Morgen das Naturschutzgebiet Son Tra und beobachte die bedrohten Rotschenkligen Kleideraffen in ihrem natürlichen Lebensraum – mit erfahrenen Rangern und Tierfotografen.
    full: |-
      <p>Wir starten je nach Jahreszeit zwischen 6:30 und 6:45 Uhr mit der Abholung am Hotel. Am frühen Morgen sind die Rotschenkligen Kleideraffen am aktivsten. Du gehst über üppige Dschungelpfade, genießt die frische Bergluft und lernst, Tiere im Blätterdach zu entdecken.</p>
      <p><strong>Was dich erwartet:</strong></p>
      <ul>
      <li>Das Naturschutzgebiet Son Tra auf kurzen, leichten Wegen erkunden.</li>
      <li>Fahrt als Sozius mit einem professionellen Fahrer auf dem Motorrad (Auto auf Anfrage gegen Aufpreis).</li>
      <li>Geführt von erfahrenen Rangern/Guides, die Tiere respektvoll beobachten.</li>
      </ul>
      <p><strong>Inklusive:</strong> Abholung &amp; Rückfahrt im Raum Da Nang · Trinkwasser &amp; frisches Obst · Fernglas oder Spektiv zum Beobachten.</p>
