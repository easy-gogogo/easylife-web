  - id: lune-show
    title: Lune Show – Teh Dar
    price: ab 490K VND
    meta:
    - 18:00 Uhr · Di–So (nicht Mo/Fr)
    - Bambuskuppel-Theater
    short: Das Lune Performing Center in Hoi An bietet mit seiner bekannten Show Teh Dar ein zauberhaftes Kulturerlebnis – eine mitreißende Mischung aus traditioneller vietnamesischer Kultur und moderner Zirkuskunst in einem einzigartigen Theater unter einer Bambuskuppel.
    full: |-
      <p>Beginn: 18:00 Uhr (ca. 1 Stunde). Spieltage: Dienstag bis Sonntag (keine Shows montags und freitags). Hinweis: Kinder unter 5 Jahren haben keinen Zutritt.</p>
      <p><strong>Ticketkategorien:</strong></p>
      <ul>
      <li>AAH! [A] Zone: 700.000 VND (Erwachsene), 490.000 VND (Kinder)</li>
      <li>OOH! [O] Zone: 1.150.000 VND (Erwachsene), 805.000 VND (Kinder)</li>
      <li>WOW! [W] Zone: 1.600.000 VND (Erwachsene), 1.120.000 VND (Kinder)</li>
      </ul>
      <p>Teh Dar bedeutet in der Sprache der K'ho „im Kreis gehen“ und entführt in die reiche Kultur des zentralen Hochlands von Vietnam: Bambus-Akrobatik, traditionelle Livemusik mit Gongs, Flöten und Trommeln sowie Geschichten aus dem Leben der Bergvölker.</p>
      <p>Das intime Theater mit 299 Plätzen im Halbkreis sorgt dafür, dass sich jeder Zuschauer mitten im Geschehen fühlt. Familienfreundlich ab 5 Jahren.</p>
