  title: Die Umgebung
  text: "Das Nalani liegt in einer schönen, ruhigen Gegend in einer stillen Straße in An Bang, Hội An. Zum Strand sind es 4 Minuten zu Fuß, zu einer der Hauptattraktionen Hội Ans – den Reisfeldern und dem Gemüsedorf mit ihren schönen Radwegen – 10 Minuten. Die Altstadt erreichst du in 20 Minuten mit dem Fahrrad – oder in der Hälfte der Zeit mit einem Roller von uns."
