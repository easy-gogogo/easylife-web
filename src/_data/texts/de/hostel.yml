todo:
  title: Was du in Hội An machen kannst
  text: "Hội An ist eine charmante Altstadt in Zentralvietnam, bekannt für ihre gut erhaltene Architektur, die von Laternen beleuchteten Gassen und ihr einzigartiges kulturelles Erbe. Bummel durch die Altstadt, besuch die Märkte und probier dich durch das Essen. Für Geschichtsfans gibt es die Japanische Brücke und den Quan-Công-Tempel – und die Strände liegen direkt vor der Tür."
