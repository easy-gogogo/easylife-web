  title: Que faire à Hội An
  text: "Hội An est une charmante ville ancienne du centre du Vietnam, connue pour son architecture bien préservée, ses rues illuminées de lanternes et son patrimoine culturel unique. Flânez dans la vieille ville, visitez les marchés locaux et goûtez la cuisine. Pour les amateurs d'histoire, il y a le pont couvert japonais et le temple Quan Công — et les plages sont à votre porte."
